name: 01 :- SecureBank Security Pipeline

on:
  workflow_dispatch:

#################
#on:
#  push:
#    branches:
#      - main
#  pull_request:
#    branches:
#      - main
##########################

# Required for GitHub Code Scanning SARIF uploads
permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: [self-hosted, linux, x64]

    defaults:
      run:
        working-directory: securebank-openbanking-api

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==================================================
      # 2. Setup Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==================================================
      # 3. Install Python dependencies
      # ==================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==================================================
      # 4. Prepare test database
      # ==================================================
      - name: Prepare test environment
        env:
          JWT_SECRET: ci-demo-secret-change-me
          DATABASE_URL: sqlite:////${{ github.workspace }}/securebank-openbanking-api/data/securebank.db
        run: |
          mkdir -p data
          rm -f data/securebank.db

          python -c "from app.database import init_db; init_db()"

          echo "=========================================="
          echo "Database created"
          echo "=========================================="

          ls -lh data/securebank.db

          echo "=========================================="
          echo "Database tables"
          echo "=========================================="

          python -c "import sqlite3; db=sqlite3.connect('data/securebank.db'); print(db.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()); db.close()"

      # ==================================================
      # 5. Unit Tests
      # ==================================================
      - name: Unit tests
        env:
          JWT_SECRET: ci-demo-secret-change-me
          DATABASE_URL: sqlite:////${{ github.workspace }}/securebank-openbanking-api/data/securebank.db
        run: |
          PYTHONPATH=. pytest -q

      # ==================================================
      # 6. Semgrep SAST
      # ==================================================
      - name: Install Semgrep
        run: |
          python -m pip install semgrep

      - name: Semgrep SAST
        continue-on-error: true
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep-results.sarif \
            .

      # ==================================================
      # 7. Upload Semgrep SARIF to GitHub Security
      # ==================================================
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: securebank-openbanking-api/semgrep-results.sarif
          category: semgrep

      # ==================================================
      # 8. Upload Semgrep report as artifact
      # ==================================================
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: securebank-openbanking-api/semgrep-results.sarif
          if-no-files-found: warn

      # ==================================================
      # 9. Trivy Filesystem Scan
      # ==================================================
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: securebank-openbanking-api
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-filesystem-results.sarif

      # ==================================================
      # 10. Upload Trivy filesystem SARIF
      # ==================================================
      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-filesystem-results.sarif
          category: trivy-filesystem

      # ==================================================
      # 11. Upload Trivy filesystem report
      # ==================================================
      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-security-report
          path: securebank-openbanking-api/trivy-filesystem-results.sarif
          if-no-files-found: warn

      # ==================================================
      # 12. Checkov IaC Scan
      # ==================================================
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: securebank-openbanking-api/terraform
          quiet: false
          output_format: cli,sarif
          output_file_path: console,results.sarif

      # ==================================================
      # 13. Upload Checkov SARIF to GitHub Security
      # ==================================================
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: checkov

      # ==================================================
      # 14. Upload Checkov report
      # ==================================================
      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-security-report
          path: results.sarif
          if-no-files-found: warn

      # ==================================================
      # 15. Docker Build
      # ==================================================
      - name: Docker build
        run: |
          docker build -t securebank:ci .

      # ==================================================
      # 16. Trivy Container Scan
      # ==================================================
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: securebank:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-container-results.sarif

      # ==================================================
      # 17. Upload Trivy Container SARIF
      # ==================================================
      - name: Upload Trivy container SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-container-results.sarif
          category: trivy-container

      # ==================================================
      # 18. Upload Trivy Container report
      # ==================================================
      - name: Upload Trivy container report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-security-report
          path: securebank-openbanking-api/trivy-container-results.sarif
          if-no-files-found: warn

      # ==================================================
      # 19. Security Summary
      # ==================================================
      - name: Security scan summary
        if: always()
        run: |
          echo "=========================================="
          echo "SecureBank Security Pipeline"
          echo "=========================================="
          echo ""
          echo "Security reports generated:"
          echo ""
          echo " - Semgrep SAST"
          echo " - Trivy Filesystem"
          echo " - Checkov IaC"
          echo " - Trivy Container"
          echo ""
          echo "Reports are available under:"
          echo "GitHub Actions -> Artifacts"
          echo ""
          echo "SARIF results are uploaded to:"
          echo "GitHub Security -> Code scanning"
          echo ""
          echo "=========================================="
