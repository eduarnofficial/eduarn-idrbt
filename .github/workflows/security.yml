name: SecureBank Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security:
    runs-on: [self-hosted, linux, x64]

    defaults:
      run:
        working-directory: securebank-openbanking-api

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Unit tests
      # --------------------------------------------------
      - name: Prepare test environment
        env:
          JWT_SECRET: ci-demo-secret-change-me
          DATABASE_URL: sqlite:////${{ github.workspace }}/securebank-openbanking-api/data/securebank.db
        run: |
          mkdir -p data
          rm -f data/securebank.db

          python -c "from app.database import init_db; init_db()"

          echo "Database created:"
          ls -lh data/securebank.db

          echo "Database tables:"
          python -c "import sqlite3; db=sqlite3.connect('data/securebank.db'); print(db.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()); db.close()"

      - name: Unit tests
        env:
          JWT_SECRET: ci-demo-secret-change-me
          DATABASE_URL: sqlite:////${{ github.workspace }}/securebank-openbanking-api/data/securebank.db
        run: |
          PYTHONPATH=. pytest -q

      # --------------------------------------------------
      # 5. Semgrep SAST
      # --------------------------------------------------
      - name: Semgrep SAST
        run: |
          python -m pip install semgrep
          semgrep scan --config auto .

      # --------------------------------------------------
      # 6. Trivy filesystem scan
      # --------------------------------------------------
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: securebank-openbanking-api
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # --------------------------------------------------
      # 7. Checkov Infrastructure-as-Code scan
      # --------------------------------------------------
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: securebank-openbanking-api/terraform
          quiet: false
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-security-report
          path: results.sarif
          if-no-files-found: warn

      # --------------------------------------------------
      # 8. Docker build
      # --------------------------------------------------
      - name: Docker build
        run: |
          docker build -t securebank:ci .

      # --------------------------------------------------
      # 9. Trivy container scan
      # --------------------------------------------------
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: securebank:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
