name: SecureBank Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security:
    runs-on: [self-hosted, linux, x64]

    defaults:
      run:
        working-directory: securebank-openbanking-api

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Prepare and initialize database
      # --------------------------------------------------
      - name: Prepare test environment
        env:
          JWT_SECRET: ci-demo-secret-change-me
          DATABASE_URL: sqlite:///./data/securebank.db
        run: |
          mkdir -p data
          python -c "from app.database import init_db; init_db()"

      # --------------------------------------------------
      # 5. Unit tests
      # --------------------------------------------------
      - name: Unit tests
        env:
          JWT_SECRET: ci-demo-secret-change-me
          DATABASE_URL: sqlite:///./data/securebank.db
        run: |
          PYTHONPATH=. pytest -q

      # --------------------------------------------------
      # 6. Semgrep SAST
      # --------------------------------------------------
      - name: Semgrep SAST
        run: |
          python -m pip install semgrep
          semgrep scan --config auto .

      # --------------------------------------------------
      # 7. Trivy filesystem scan
      # --------------------------------------------------
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: securebank-openbanking-api
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # --------------------------------------------------
      # 8. Checkov IaC scan
      # --------------------------------------------------
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: securebank-openbanking-api/terraform
          quiet: true

      # --------------------------------------------------
      # 9. Docker build
      # --------------------------------------------------
      - name: Docker build
        run: |
          docker build -t securebank:ci .

      # --------------------------------------------------
      # 10. Trivy container scan
      # --------------------------------------------------
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: securebank:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
